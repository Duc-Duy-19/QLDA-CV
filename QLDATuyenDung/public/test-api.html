<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Company API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #0056b3; }
        .result { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 4px; margin-top: 20px; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Company API</h1>
        
        <div class="form-group">
            <label for="token">Bearer Token:</label>
            <input type="text" id="token" placeholder="Nhập token từ localStorage hoặc API login">
            <button onclick="getStoredToken()">Lấy từ localStorage</button>
            <button onclick="setToken()">Lưu vào localStorage</button>
        </div>
        
        <div class="form-group">
            <button onclick="testGetCompany()">Test GET /api/my-company</button>
            <button onclick="clearResult()">Clear</button>
        </div>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
    const API_BASE_URL = window.API_BASE_URL || '/api';
        
        function log(message, type = 'info') {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.className = 'result ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
            result.innerHTML += `<div><strong>[${new Date().toLocaleTimeString()}]</strong> ${message}</div>`;
        }
        
        function clearResult() {
            const result = document.getElementById('result');
            result.style.display = 'none';
            result.innerHTML = '';
        }
        
        function getStoredToken() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('token').value = token;
                log('Token loaded from localStorage', 'success');
            } else {
                log('No token found in localStorage', 'error');
            }
        }
        
        function setToken() {
            const token = document.getElementById('token').value.trim();
            if (token) {
                localStorage.setItem('token', token);
                log('Token saved to localStorage', 'success');
            } else {
                log('Please enter a token', 'error');
            }
        }
        
        function testGetCompany() {
            const token = document.getElementById('token').value.trim();
            
            if (!token) {
                log('Please enter a token first', 'error');
                return;
            }
            
            log('Testing GET /api/my-company...');
            
            fetch(`${API_BASE_URL}/my-company`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                log(`Response status: ${response.status} ${response.statusText}`);
                return response.json();
            })
            .then(data => {
                log('Response data: ' + JSON.stringify(data, null, 2), 'success');
            })
            .catch(error => {
                log('Error: ' + error.message, 'error');
            });
        }
        
        // Auto load token on page load
        window.onload = function() {
            getStoredToken();
        };
    </script>
</body>
</html>
