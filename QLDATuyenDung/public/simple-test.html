<!DOCTYPE html>
<html>
<head>
    <title>Simple AI Test</title>
</head>
<body>
    <h1>Simple AI Test</h1>
    <button onclick="test()">Test API</button>
    <pre id="result"></pre>

    <script>
        async function test() {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Testing...';
            
            try {
                const token = localStorage.getItem('authToken');
                
                if (!token) {
                    resultDiv.textContent = 'ERROR: No auth token found. Please login first.';
                    return;
                }
                
                console.log('Calling API...');
                const response = await fetch('/api/chat/ai/start', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Status:', response.status);
                
                const text = await response.text();
                console.log('Response:', text);
                
                resultDiv.textContent = `Status: ${response.status}\n\nResponse:\n${text}`;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.textContent = 'EXCEPTION: ' + error.message + '\n\n' + error.stack;
            }
        }
    </script>
</body>
</html>
